<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890" role="img" aria-labelledby="title description">
  <title id="title">バトルエフェクト強化案：連続フレーム</title>
  <desc id="description">こうげき、バリア、まほう、チャージの各演出を3コマずつ並べたストーリーボード。</desc>
  <rect width="1440" height="890" fill="#f6edda"/>
  <text x="32" y="43" fill="#8f6747" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2">ARTTLE · AFTER CONCEPT · THREE FRAMES PER ACTION</text>
  <text x="32" y="75" fill="#342c25" font-family="sans-serif" font-size="26" font-weight="700">強化案の動き — ためる → 動く → 余韻</text>
  <g fill="#75685b" font-family="sans-serif" font-size="12" font-weight="700">
    <text x="207" y="105">1 · ため / 発動</text>
    <text x="614" y="105">2 · 突進 / ヒット</text>
    <text x="1021" y="105">3 · 余波 / 戻り</text>
  </g>
  <g fill="#342c25" font-family="sans-serif" font-size="18" font-weight="700">
    <text x="28" y="161">01 こうげき</text>
    <text x="28" y="359">02 バリア</text>
    <text x="28" y="557">03 まほう</text>
    <text x="28" y="755">04 チャージ</text>
  </g>
  <g fill="#75685b" font-family="sans-serif" font-size="10">
    <text x="28" y="181">ためる・踏み込み・衝撃</text>
    <text x="28" y="379">展開・波紋・破片</text>
    <text x="28" y="577">陣・飛翔・着弾</text>
    <text x="28" y="775">収束・脈動・強化</text>
  </g>
  <g fill="#fffaf0" stroke="#d8c8aa">
    <rect x="194" y="119" width="398" height="148" rx="10"/>
    <rect x="601" y="119" width="398" height="148" rx="10"/>
